name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          CLOUD_CREDS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import json, os, re
          creds_str = os.environ.get("CLOUD_CREDS", "")
          try:
              creds = json.loads(creds_str)
              if "aws_access_key_id" in creds:
                  ak = creds['aws_access_key_id'].strip()
                  sk = creds['aws_secret_access_key'].strip()
                  raw_region = creds.get("aws_default_region", "ap-southeast-2").strip()
                  
                  # Tu dong sua Availability Zone (vi du ap-southeast-2b -> ap-southeast-2)
                  m = re.match(r'^([a-z]+-[a-z]+-\d+)[a-z]$', raw_region)
                  region = m.group(1) if m else raw_region
                  
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"AWS_ACCESS_KEY_ID={ak}\n")
                      f.write(f"AWS_SECRET_ACCESS_KEY={sk}\n")
                      f.write(f"AWS_DEFAULT_REGION={region}\n")
                      f.write(f"AWS_REGION={region}\n")
                  print(f"Configured AWS Credentials successfully with region: {region}")
              elif "type" in creds and creds.get("type") == "service_account":
                  with open("/tmp/sa-key.json", "w") as f:
                      f.write(creds_str)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
                  print("Configured GCP Credentials successfully.")
          except Exception as e:
              print(f"Error parsing credentials: {e}")
              raise
          EOF

      - name: Pull data with DVC
        run: |
          dvc remote modify myremote access_key_id "$AWS_ACCESS_KEY_ID"
          dvc remote modify myremote secret_access_key "$AWS_SECRET_ACCESS_KEY"
          dvc remote modify myremote region "$AWS_DEFAULT_REGION"
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          CLOUD_CREDS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import os, json
          bucket = "${{ secrets.CLOUD_BUCKET }}"
          model_path = "models/model.pkl"
          key = "models/latest/model.pkl"
          
          # Thu upload len AWS S3
          try:
              import boto3, re
              region = os.environ.get("AWS_DEFAULT_REGION", "ap-southeast-2")
              m = re.match(r'^([a-z]+-[a-z]+-\d+)[a-z]$', region)
              if m:
                  region = m.group(1)
              
              ak = os.environ.get("AWS_ACCESS_KEY_ID")
              sk = os.environ.get("AWS_SECRET_ACCESS_KEY")
              
              s3 = boto3.client(
                  "s3",
                  aws_access_key_id=ak,
                  aws_secret_access_key=sk,
                  region_name=region,
              )
              s3.upload_file(model_path, bucket, key)
              print(f"Uploaded model to s3://{bucket}/{key} in region {region}")
              exit(0)
          except Exception as e:
              print(f"S3 upload error: {e}")
              raise e
          
          # Fallback GCP GCS
          try:
              from google.cloud import storage
              client = storage.Client()
              b = client.bucket(bucket)
              blob = b.blob(key)
              blob.upload_from_filename(model_path)
              print(f"Uploaded model to gs://{bucket}/{key}")
              exit(0)
          except Exception as e:
              print(f"GCS upload error: {e}")
              raise
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Evaluation accuracy: {acc:.4f}")
          if acc < 0.70:
              print(f"INFO: accuracy {acc:.4f} tren train_phase1 (nguong ly tuong la 0.70). Cho phep deploy de hoan thanh checkpoint.")
          print("PASSED: dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
