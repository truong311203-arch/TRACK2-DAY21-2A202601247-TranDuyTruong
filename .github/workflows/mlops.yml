name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "setuptools<70"

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3 dvc-s3 "setuptools<70"

      - name: Authenticate to Cloud Storage
        run: |
          python - <<'EOF'
          import json, os
          creds_str = """${{ secrets.CLOUD_CREDENTIALS }}"""
          try:
              creds = json.loads(creds_str)
              if "aws_access_key_id" in creds:
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"AWS_ACCESS_KEY_ID={creds['aws_access_key_id']}\n")
                      f.write(f"AWS_SECRET_ACCESS_KEY={creds['aws_secret_access_key']}\n")
                      region = creds.get("aws_default_region", "us-east-1")
                      f.write(f"AWS_DEFAULT_REGION={region}\n")
              elif "type" in creds and creds.get("type") == "service_account":
                  with open("/tmp/sa-key.json", "w") as f:
                      f.write(creds_str)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
          except Exception as e:
              print(f"Error parsing credentials: {e}")
          EOF

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os, json
          bucket = "${{ secrets.CLOUD_BUCKET }}"
          model_path = "models/model.pkl"
          key = "models/latest/model.pkl"
          
          # Thu upload len AWS S3
          try:
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(model_path, bucket, key)
              print(f"Uploaded model to s3://{bucket}/{key}")
              exit(0)
          except Exception as e:
              print(f"S3 upload error ({e}), thu voi GCS...")
          
          # Fallback GCP GCS
          try:
              from google.cloud import storage
              client = storage.Client()
              b = client.bucket(bucket)
              blob = b.blob(key)
              blob.upload_from_filename(model_path)
              print(f"Uploaded model to gs://{bucket}/{key}")
              exit(0)
          except Exception as e:
              print(f"GCS upload error: {e}")
              raise
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Evaluation accuracy: {acc:.4f}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print("PASSED: dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
